project:
  name: credit-default-early-warning
  prefix: CRISK_DEMO
  description: Synthetic retail credit default MLOps demonstration

snowflake:
  database: CRISK_DEMO_DB
  warehouse: CRISK_DEMO_WH
  compute_pool: CRISK_DEMO_POOL
  schemas:
    raw: RAW
    dev: DEV
    test: TEST
    prod: PROD
    control: CONTROL
    feature_store: DEV_FEATURE_STORE
  stages:
    releases: RELEASES
    jobs: JOB_PAYLOADS
    dags: DAG_PAYLOADS
  roles:
    developer: CRISK_DEMO_DEVELOPER
    engineer: CRISK_DEMO_ENGINEER
    prod_owner: CRISK_DEMO_PROD_OWNER
    service: CRISK_DEMO_SERVICE

compute:
  warehouse_size: XSMALL
  warehouse_auto_suspend_seconds: 60
  pool_instance_family: GEN_X64_G2_8
  pool_min_nodes: 1
  pool_max_nodes: 4
  pool_auto_suspend_seconds: 300

data:
  seed: 20260912
  account_count: 5000
  first_observation_month: 2024-03-01
  observation_months: 30
  as_of_date: 2026-09-01
  outcome_window_days: 90
  drift_start_date: 2026-01-01
